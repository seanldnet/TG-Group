services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tg_group
      POSTGRES_USER: tg_group
      POSTGRES_PASSWORD: ${TG_GROUP_DB_PASSWORD:?generated by installer}
    volumes:
      - tg_group_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_group -d tg_group"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    image: ghcr.io/seanldnet/tg-group-api:latest
    restart: unless-stopped
    environment:
      TG_GROUP_ENV: production
      TG_GROUP_HTTP_PORT: "8080"
      DATABASE_URL: postgres://tg_group:${TG_GROUP_DB_PASSWORD}@postgres:5432/tg_group?sslmode=disable
      BOT_TOKEN_ENCRYPTION_KEY: ${TG_GROUP_BOT_ENCRYPTION_KEY:?generated by installer}
      PAYMENT_CREDENTIALS_ENCRYPTION_KEY: ${TG_GROUP_PAYMENT_ENCRYPTION_KEY:?generated by installer}
      PAYMENT_PUBLIC_BASE_URL: ${TG_GROUP_PAYMENT_PUBLIC_BASE_URL:-}
      TELEGRAM_AUTH_BOT_TOKEN: ${TG_GROUP_TELEGRAM_AUTH_BOT_TOKEN:-}
      TELEGRAM_AUTH_BOT_USERNAME: ${TG_GROUP_TELEGRAM_AUTH_BOT_USERNAME:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks: [internal]

  web:
    image: ghcr.io/seanldnet/tg-group-web:latest
    restart: unless-stopped
    ports:
      - "18680:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [internal]

volumes:
  tg_group_postgres:
networks:
  internal:
    driver: bridge
