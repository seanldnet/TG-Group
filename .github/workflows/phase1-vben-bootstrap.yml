name: Phase 1 - Vben Admin bootstrap

on:
  push:
    branches:
      - feat/phase-1-vben-admin
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: phase-1-vben-admin
  cancel-in-progress: false

jobs:
  bootstrap-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preserve project-specific files
        run: |
          mkdir -p /tmp/tg-project
          cp -a README.md docs scripts /tmp/tg-project/
          mkdir -p /tmp/tg-project/.github
          cp -a .github/workflows /tmp/tg-project/.github/

      - name: Import pinned Vben Admin v2.11.5
        run: |
          git clone --depth 1 --branch v2 https://github.com/vbenjs/vue-vben-admin.git /tmp/vben-admin
          test "$(git -C /tmp/vben-admin rev-parse HEAD)" = "038936ff7d6178b1f3da2f5e6a36dc5a1155c74b"
          rsync -a --delete --exclude='.git' /tmp/vben-admin/ ./
          cp -a /tmp/tg-project/README.md ./README.md
          cp -a /tmp/tg-project/docs ./docs
          cp -a /tmp/tg-project/scripts ./scripts
          mkdir -p .github
          cp -a /tmp/tg-project/.github/workflows .github/workflows

      - name: Create five SaaS administration pages
        run: |
          bash scripts/phase1-ui.sh
          bash scripts/check-ui-spacing.sh

      - name: Commit Vben and Phase 1 scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(admin): bootstrap Vben Admin and Phase 1 UI [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create Phase 1 pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "feat(admin): initialize Vben Admin and five SaaS pages" \
            --body "## Phase 1 scope
          - Import Vue Vben Admin v2.11.5 from pinned upstream commit
          - Add dashboard, order management, settings, agent management, and payment gateway configuration pages
          - Use PageContainer, Ant Design Card/Alert, Vben BasicTable/BasicForm/BasicModal/BasicDrawer
          - Enforce gap-4 spacing and prohibit manual margin utilities on the five pages
          
          UI remains a skeleton with demo data; no business API, database, or payment processing is claimed as complete.
          
          Phase 1 cannot be accepted until TypeScript, production build, and the five-page visual spacing review pass." \
            || gh pr view "${{ github.ref_name }}" --json url

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.0.4 --activate
          pnpm install --no-frozen-lockfile

      - name: TypeScript validation
        run: pnpm run type:check

      - name: Production build
        run: pnpm run build

      - name: Upload production build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tg-group-admin-phase1-dist
          path: dist/
          if-no-files-found: warn
