name: Publish Docker images

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.api"
      - "Dockerfile.web"
      - "deploy/**"
      - "cmd/**"
      - "internal/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/publish-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish multi-arch images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/seanldnet/tg-group-api:latest
            ghcr.io/seanldnet/tg-group-api:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/seanldnet/tg-group-web:latest
            ghcr.io/seanldnet/tg-group-web:${{ github.sha }}

      - name: Make GHCR packages public for passwordless docker pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /user/packages/container/tg-group-api/visibility -f visibility=public || true
          gh api --method PATCH /user/packages/container/tg-group-web/visibility -f visibility=public || true
