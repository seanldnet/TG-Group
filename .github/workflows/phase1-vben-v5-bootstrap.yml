name: Phase 1 - Vben Admin V5 validation

on:
  pull_request:
    branches:
      - main
      - feat/auth-session-api
      - feat/bot-runtime-worker-v2
    paths:
      - 'apps/web-antd/**'
      - 'tg-group/scripts/**'
      - '.github/workflows/phase1-vben-v5-bootstrap.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - feat/phase-1-vben-v5
    paths:
      - 'apps/web-antd/**'
      - 'tg-group/scripts/**'
      - '.github/workflows/phase1-vben-v5-bootstrap.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-1-vben-v5-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5 phase branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm --version
      - name: Install V5 workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check V5 spacing and single-owner architecture
        run: bash tg-group/scripts/check-phase1-v5-spacing.sh
      - name: TypeScript validation
        run: pnpm --filter @vben/web-antd run typecheck
      - name: Production build
        run: pnpm --filter @vben/web-antd run build
      - name: Upload V5 production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tg-group-admin-v5-phase1-dist
          path: apps/web-antd/dist/
          if-no-files-found: error
