name: Phase 1 - Vben Admin V5 bootstrap

on:
  push:
    branches:
      - feat/phase-1-vben-v5
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: phase-1-vben-v5
  cancel-in-progress: false

jobs:
  bootstrap-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5 phase branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preserve TG Group project documents and scripts
        run: |
          mkdir -p /tmp/tg-project/.github
          cp -a README.md CHANGELOG.md docs scripts /tmp/tg-project/
          cp -a .github/workflows /tmp/tg-project/.github/

      - name: Import official Vue Vben Admin V5
        env:
          VBEN_V5_SHA: e726bc92780c1023c2393042871470d413ad79dc
        run: |
          git init /tmp/vben-admin-v5
          git -C /tmp/vben-admin-v5 remote add origin https://github.com/vbenjs/vue-vben-admin.git
          git -C /tmp/vben-admin-v5 fetch --depth 1 origin "$VBEN_V5_SHA"
          git -C /tmp/vben-admin-v5 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/vben-admin-v5 rev-parse HEAD)" = "$VBEN_V5_SHA"
          rsync -a --delete --exclude='.git' /tmp/vben-admin-v5/ ./
          cp -a /tmp/tg-project/README.md ./README.md
          cp -a /tmp/tg-project/CHANGELOG.md ./CHANGELOG.md
          rm -rf docs scripts .github/workflows
          cp -a /tmp/tg-project/docs ./docs
          cp -a /tmp/tg-project/scripts ./scripts
          mkdir -p .github
          cp -a /tmp/tg-project/.github/workflows .github/workflows
          rm -f .github/workflows/phase1-vben-bootstrap.yml
          rm -f scripts/phase1-ui.sh scripts/check-ui-spacing.sh
          chmod +x scripts/phase1-v5-ui.sh scripts/check-phase1-v5-spacing.sh

      - name: Generate five V5-native administration pages
        run: |
          bash scripts/phase1-v5-ui.sh
          bash scripts/check-phase1-v5-spacing.sh

      - name: Commit and push V5 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "V5 import is already up to date; no new commit is required."
          else
            git commit -m "feat(admin): import Vben Admin V5 and add SaaS pages [skip ci]"
          fi
          git push origin HEAD:${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm --version

      - name: Install V5 workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript validation
        run: pnpm --filter @vben/web-antd run typecheck

      - name: Production build
        run: pnpm --filter @vben/web-antd run build

      - name: Upload V5 production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tg-group-admin-v5-phase1-dist
          path: apps/web-antd/dist/
          if-no-files-found: error
