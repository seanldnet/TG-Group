name: Backend Go validation

on:
  pull_request:
    branches:
      - main
      - feat/phase-1-vben-v5
      - feat/backend-foundation
      - feat/auth-session-api
      - feat/cap-login-verification
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'compose.yaml'
  push:
    branches:
      - feat/backend-foundation
      - feat/auth-session-api
      - feat/cap-login-verification
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'compose.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Resolve dependencies
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./cmd/server
