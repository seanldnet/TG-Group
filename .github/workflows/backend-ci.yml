name: Backend Go validation

on:
  pull_request:
    branches:
      - main
      - feat/phase-1-vben-v5
      - feat/backend-foundation
      - feat/auth-session-api
      - feat/bot-management-api
      - feat/bot-runtime-worker-v2
      - feat/docker-one-click-install
      - feat/garble-release-pipeline
      - feat/baota-web-installer
      - feat/baota-release-bundle-v2
      - feat/v5-cap-integration
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'compose.yaml'
  push:
    branches:
      - feat/backend-foundation
      - feat/auth-session-api
      - feat/garble-release-pipeline
      - feat/baota-web-installer
      - feat/v5-cap-integration
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'compose.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tg_group_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tg_group_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tg_group_test?sslmode=disable
      TEST_REDIS_ADDR: 127.0.0.1:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Resolve dependencies
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./cmd/server
