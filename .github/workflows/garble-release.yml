name: Garble binary release
run-name: Garble + V5 bundle / ${{ github.ref_name }}

on:
  pull_request:
    branches:
      - main
      - feat/docker-one-click-install
      - feat/baota-web-installer
    paths:
      - 'backend/**'
      - 'apps/web-antd/**'
      - 'packages/**'
      - 'internal/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/release/**'
      - '.github/workflows/garble-release.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garble-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build linux/${{ matrix.arch }} with Garble
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: backend/go.sum

      - name: Install pinned Garble
        run: |
          go install mvdan.cc/garble@v0.14.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          garble version

      - name: Test backend
        working-directory: backend
        run: |
          go mod tidy
          cat go.sum
          go test ./...
          go vet ./...

      - name: Set UTC build timestamp
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build obfuscated release binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-ci' }}
          COMMIT: ${{ github.sha }}
        run: bash scripts/release/build-garble.sh

      - name: Enable QEMU for target-architecture smoke test
        uses: docker/setup-qemu-action@v3

      - name: Smoke test binary in target architecture
        env:
          EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-ci' }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          output="$(docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD/dist:/dist:ro" alpine:3.21 /dist/tg-group-linux-${{ matrix.arch }} --version)"
          printf '%s\\n' "$output"
          grep -F "TG Group $EXPECTED_VERSION" <<< "$output"
          grep -F "$EXPECTED_COMMIT" <<< "$output"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-group-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Garble Release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tg-group-linux-*
          path: release-assets
          merge-multiple: true

      - name: Generate aggregate checksums and metadata
        working-directory: release-assets
        run: |
          sha256sum tg-group-linux-amd64 tg-group-linux-arm64 > SHA256SUMS
          {
            echo "TG Group Garble release"
            echo "Version: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Targets: linux/amd64, linux/arm64"
            echo "Go: 1.23.12"
            echo "Garble: v0.14.2"
            echo "Flags: -literals -tiny -trimpath -ldflags=-s-w"
            echo "Garble provides obfuscation, not encryption or absolute reverse-engineering protection."
          } > BUILD-METADATA.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/tg-group-linux-amd64
            release-assets/tg-group-linux-arm64
            release-assets/SHA256SUMS
            release-assets/BUILD-METADATA.txt
