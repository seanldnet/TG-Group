services:
  postgres:
    image: postgres:16-alpine
    container_name: tg-group-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: tg_group
      POSTGRES_USER: tg_group
      POSTGRES_PASSWORD: tg_group_dev
    ports:
      - "${TG_GROUP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - tg_group_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_group -d tg_group"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tg-group-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${TG_GROUP_REDIS_PASSWORD:-tg_group_dev}"]
    ports:
      - "${TG_GROUP_REDIS_PORT:-6379}:6379"
    volumes:
      - tg_group_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${TG_GROUP_REDIS_PASSWORD:-tg_group_dev} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tg_group_postgres_data:
  tg_group_redis_data:
